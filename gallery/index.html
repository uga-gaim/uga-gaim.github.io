<!DOCTYPE html>
<html lang="en">
<head>

    <base href="/">
    <title>Gallery | GAIM Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="assets/lab/logo.png">

            </div>

        <div class="gallery-divider"><h2>Lab Picture • 10/2025</h2></div>

        <div>
            <img class="gallery-single-slot" src="assets/10_2025.jpeg" alt="">

    <div id="footer-placeholder"></div>
